name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      # Performance gate: benchmark this PR back-to-back against main on the
      # same runner, interleaved per suite, so hardware noise cancels out.
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          path: main-ref
      - run: node test/perf/compare-cli.ts main-ref
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.node == 26
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
